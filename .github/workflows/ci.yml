name: Offline regression and wheel qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: uv run --frozen ruff check qobuz_dl2 tests scripts benchmarks
      - run: uv run --frozen ruff format --check qobuz_dl2 tests scripts benchmarks
      - if: matrix.python == '3.9'
        run: uv run --frozen mypy qobuz_dl2
      - run: uv build
      - run: uv run --frozen python scripts/verify_distributions.py dist
      - name: Install and smoke the built wheel, without project imports
        shell: bash
        run: uv run --isolated --no-project --with "$(find dist -name '*.whl' -print -quit)" python scripts/smoke_installed.py tests/fixtures/tone.mp3
